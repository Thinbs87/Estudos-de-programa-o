<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }

        td, th {
            border: 1px solid black;
            padding: 8px;
        }

        .cnome {
            background-color: darkmagenta;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>F</td>
                <td>25</td>
                <td>Estudante</td>
            </tr>
            <tr>
                <td>Marco</td>
                <td>M</td>
                <td>32</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Francisco</td>
                <td>M</td>
                <td>37</td>
                <td>Vagabundo</td>
            </tr>
            <tr>
                <td>Melanie</td>
                <td>F</td>
                <td>18</td>
                <td>Herdeira</td>
            </tr>
            <tr>
                <td>Ana K</td>
                <td>F</td>
                <td>75</td>
                <td>Aposentada</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
