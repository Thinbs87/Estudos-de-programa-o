<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de celulas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            height: 300px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células</h1>
    <table>
        <tbody>
            <tr>
                <td>A1</td>
                <td colspan="2">B1</td>
            </tr>
             <tr>
                <td>A2</td>
                <td>B2</td>
                <td>C2</td>
            </tr>
             <tr>
                <td rowspan="3">A3</td>
                <td></td>
                <td>C3</td>
            </tr>
             <tr>
                
                <td>B4</td>
                <td>C4</td>
            </tr>
             <tr>
                
                <td>B5</td>
                <td>C5</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
