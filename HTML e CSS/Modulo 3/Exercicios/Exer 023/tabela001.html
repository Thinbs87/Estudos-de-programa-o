<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            width: 300px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 2px;
            margin: 2px;
            text-align: center;
            border-radius: 50%;
        }

        #primeira {
            background-color: aqua;
        }

        #segunda {
            background-color: chartreuse;
        }

        #terceira {
            background-color: lightpink;
        }
    </style>
</head>

<body>
    <h1>Minha primeira tabela</h1>
    <Table>
        <tr>
            <th>Cabeçalho</th>
            <th>da</th>
            <th>tabela</th>
        </tr>
        <tr id="primeira">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr id="segunda">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr id="terceira">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
    </Table>

    <h2>Segunda Tabela</h2>
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
    </table>
</body>

</html>
