<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            position: relative;
            height: 500px;
            background: yellowgreen url(imagens/alvo.png) no-repeat center / 500px;
            background-size: 100% 100%;
        }

        #conteudo {
            height: 200px;
            background-color: purple;
            background-image: url(imagens/alvo.png);
            background-size: 100% 100%;
            width: 200px;
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
