<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1{
            /* Box-level */
            background-color: lightseagreen;
            width: 383px;
            height: 50px;
            text-align: center;

            border: 10px solid lightgoldenrodyellow;
            border-radius: 20px 10px;

            margin: auto;

            outline-width: 10px;
            outline-style: ridge;
            outline-color: darkgoldenrod;
        }
        /* Inline Level */
        a{
            border-width: 3px;
            border-style: solid;
            border-color: chartreuse;
            background-color: bisque;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem são box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>, vamos ver como tudo isso funciona </p>
    
</body>
</html>
