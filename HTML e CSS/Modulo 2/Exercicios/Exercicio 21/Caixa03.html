<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borda personalizada</title>
    <style>
        #primeiro {
            border: 20px solid black;
            text-align: center;
            padding: 10px;
            margin: auto;
            width: 200px;
            border-image-source: url(borda.png);
            border-image-slice: 50;
            border-image-repeat: repeat;
        }
        #segunda {
            border: 20px solid black;
            text-align: center;
            padding: 10px;
            margin: auto;
            border-image-source: url(borda.png);
            border-image-slice: 39;
            border-image-repeat: repeat;
        }
        #terceira {
            border: 20px solid black;
            text-align: center;
            padding: 10px;
            margin: auto;
            border-image-source: url(borda.png);
            border-image-slice: 27;
            border-image-repeat: repeat;
        }

        p{
            text-align: center;
            margin: auto;
        }

        img{
            margin: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1 id="primeiro">Teste de borda</h1>
    <br><br><br>
    <h1 id="segunda">Novo teste de borda</h1>
    <br><br><br>
    <h1 id="terceira"> Mais um teste de borda</h1>
    <br><br><br>
    <p>Tudo gerado com a seguinte imagem</p>
    <br><br>
    <img src="borda.png" alt="borda">
</body>
</html>
