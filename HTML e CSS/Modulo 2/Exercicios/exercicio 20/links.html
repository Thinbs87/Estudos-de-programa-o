<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
   <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: black;
            font-weight: bold;
            text-decoration: none;
        }
        a:visited {
            color: rgba(205, 33, 145, 0.952);
        }
        a:hover {
            text-decoration: underline;
        }
        a:active {
            color:blueviolet
        }
        a::after {
            content: '[link]';
            font-weight: lighter;
        }
        .especial::after{
            content: '⊗⇐';
        }
        .especial::before{
            content: "⇒⊗";
        }
        .especial {
            background-color: aqua;
        }

   </style>
</head>
<body>
    <h1>Personalizando links </h1>
    <ul>
        <li><a href="https://github.com/Thinbs87/Estudos-de-programa-o" class='especial' target="_blank">Repositório Github</a></li>
        <li><a href="https://youtube.com" target="_blank">Canal Youtube</a></li>
        <li><a href="http://tatuapérugby.com.br" target="_blank">Site</a></li>
    </ul>
    
</body>
</html>
