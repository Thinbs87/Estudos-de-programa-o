<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            display: inline-block;
            background-color: rgb(208, 32, 176);
            border: 2px;
            text-align: center;
            height: 200px;
            width: 200px;
        }

        div > p {
            display: none;
        }

        div:hover {
            background-color: yellow;
        }

        div:hover >p {
            display:block;
            background-color: blueviolet;
        }
        h1 {
            text-align: center;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Fazendo sumir e aparecer</h1>
    <p>Passe o mouse no quadrado abaixo</p>
    <div>
        Passe o mouse aqui
        <p>Surprise mothafuka</p>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
